name: ♻️ Reusable workflow EJEMMPLO 

on:  
  workflow_call:
    inputs:
      greeting:
        description: 'UN AMIGO SALUSANDO'
        type: string
        required: true
        default: 'HOLIS'
    secrets:
      MY_SECRET:
        description: 'UN VALOR SECRETO'
        required: true
  workflow_dispatch:
    inputs:
      test:
        type: choice
        options:
          - Si
          - No
          
        required: true

jobs:
 build:
    runs-on: ubuntu-latest
    steps:
    - name: See inputs and secrets
      run: |
        echo "SALUDABA ${{ inputs.greeting }}"
        echo "EL SECRETO ERA ${{ secrets.MY_SECRET }}"
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: |
        dotnet restore        
    - name: Build
      run: |
        dotnet build --no-restore
